plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'

    id 'net.minecraftforge.licenser'    version '1.2.0'
    id 'net.minecraftforge.gradleutils' version '3.3.21'
    id 'net.minecraftforge.gitversion'  version '3.1.7'
    id 'net.minecraftforge.changelog'   version '3.1.3'
    id 'com.gradleup.shadow' version '9.3.0'
}

gradleutils.displayName = 'MCPCleanup'
description = "Standalone tool to do legacy cleanup tasks for Minecraft source code"
group = 'net.minecraftforge'
version = gitversion.tagOffset
println "Version: $version"

changelog {
    from '2.3'
}

repositories {
    mavenCentral()
}

license {
    header project.file('LICENSE-header.txt')
    include 'net/minecraftforge/mcpcleanup/**/*.java'
    exclude 'net/minecraftforge/mcpcleanup/ContextualPatch.java'
    newLine false
}

tasks.withType(Jar).configureEach {
    manifest.attributes([
        'Main-Class'            : 'net.minecraftforge.mcpcleanup.ConsoleTool',
        'Implementation-Version': project.version
    ])
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = 'fatjar'
    enableAutoRelocation = true
    relocationPrefix = 'net.minecraftforge.mcpcleanup.shadow'
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer) {
        paths = [ 'Messages.properties$' ]
        keyTransformer = { key -> 'net.minecraftforge.mcpcleanup.shadow.' + key }
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

dependencies {
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'com.github.abrarsyed.jastyle:jAstyle:1.3'
    implementation 'com.google.code.gson:gson:2.8.6'
}

publishing {
    repositories {
        maven gradleutils.publishingForgeMaven
    }

    publications {
        mavenJava(MavenPublication) {
            from components.java
            changelog.publish(it)
            gradleutils.promote(it)

            pom { pom ->
                name = gradleutils.displayName
                description = project.description

                gradleutils.pom.addRemoteDetails(pom)
                
                licenses {
                    license gradleutils.pom.licenses.LGPLv2_1
                }

                developers {
                    developer gradleutils.pom.developers.LexManos
                }
            }
        }
    }
}
